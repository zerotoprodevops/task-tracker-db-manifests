apiVersion: apps/v1

kind: Deployment

metadata:
  name: db-deployment
  labels:
    type: deployment
    use: db
    env: dev

spec:
  replicas: 1
  selector:
    matchLabels:
      type: mongoDB
      env: dev
  template:
    metadata:
      name: mongo-db
      labels:
        type: mongoDB
        env: dev
    containers:
      - name: mongo-db-container
        image: mongo:latest
        ports:
          - containerPort: 27017